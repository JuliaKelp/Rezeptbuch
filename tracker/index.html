<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tracker · Rezeptbuch</title>
  <meta name="theme-color" content="#FFF8F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rezeptbuch">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Kalorien-Tracker von ST0PTV (github.com/st0ptv/Calorie-Tracker), MIT-Lizenz (siehe LICENSE),
       ins Rezeptbuch übernommen und an dessen Design angepasst. -->
  <main id="view"></main>

  <nav class="tabbar" aria-label="Navigation">
    <a class="tab-home" href="../#/heute">Rezepte</a>
    <button data-tab="diary" class="active">Journal</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="food">Essen</button>
    <button data-tab="history">Analytics</button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="vendor/zxing.min.js" defer></script>
  <script src="js/caffeine.js" defer></script>
  <script src="js/alcohol.js" defer></script>
  <script src="js/weightgoal.js" defer></script>
  <script src="js/food.js" defer></script>
  <script src="js/timeline.js" defer></script>
  <script src="js/supp_catalog.js" defer></script>
  <script src="js/supplements.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
