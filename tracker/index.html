<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tracker · Rezeptbuch</title>
  <meta name="theme-color" content="#FFF8F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rezeptbuch">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <!-- Kalorien-Tracker von ST0PTV (github.com/st0ptv/Calorie-Tracker), MIT-Lizenz (siehe LICENSE),
       ins Rezeptbuch übernommen und an dessen Design angepasst. -->
  <nav class="subbar" aria-label="Tracker-Bereiche">
    <button data-tab="diary" class="active">Journal</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="food">Essen</button>
    <button data-tab="history">Analytics</button>
  </nav>
  <main id="view"></main>

  <!-- Menü wie im Rezeptbuch (Entwurf B): Heute, Rezepte, Tracker, Ich; Scan-Knopf unten rechts -->
  <nav class="rbnav" aria-label="Hauptmenü"><div class="rbnav-in">
    <a href="../#/heute"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 L12 4 L21 11"/><path d="M5 10 V20 H19 V10"/></svg>Heute</a>
    <a href="../#/rezepte"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5 H10 A2 2 0 0 1 12 7 V20 A2 2 0 0 0 10 18 H4 Z"/><path d="M20 5 H14 A2 2 0 0 0 12 7 V20 A2 2 0 0 1 14 18 H20 Z"/></svg>Rezepte</a>
    <a href="./" aria-current="page"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 A9 9 0 1 1 3.5 9"/><path d="M12 7 A5 5 0 1 1 7 12"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Tracker</a>
    <a href="../#/ich"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20 A8 8 0 0 1 20 20"/></svg>Ich</a>
  </div></nav>
  <button type="button" class="scan-fab" id="scanFab" aria-label="Einkauf scannen"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h2v12M9 6v12M12 6v12M15 6h1v12M19 6h1v12"/></svg></button>



  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="vendor/zxing.min.js" defer></script>
  <script src="../vorrat.js" defer></script>
  <script src="../backup.js" defer></script>
  <script src="js/caffeine.js" defer></script>
  <script src="js/alcohol.js" defer></script>
  <script src="js/weightgoal.js" defer></script>
  <script src="js/food.js" defer></script>
  <script src="js/timeline.js" defer></script>
  <script src="js/supp_catalog.js" defer></script>
  <script src="js/supplements.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
